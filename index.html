    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens because some SDKs (like Groq/OpenAI via Stainless) try to polyfill fetch
      // by assigning to globalThis.fetch, which is window in the browser.
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(v) { originalFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Paperloo: Failed to make fetch configurable', e);
        }
      })();
    </script>
